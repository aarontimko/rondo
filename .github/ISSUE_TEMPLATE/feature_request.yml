name: Feature request
description: Suggest something rondo should be able to do.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        A feature needs an issue before a pull request, so the shape can be
        agreed before anyone writes it. This is that issue.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and where rondo gets in the way.
    validations:
      required: true

  - type: textarea
    id: behaviour
    attributes:
      label: The proposed behaviour
      description: >
        What should happen instead. If it is a new script or a new flag, write
        the command line you want to type.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to get the same result, and why they are worse.
    validations:
      required: false

  - type: dropdown
    id: pr
    attributes:
      label: Would you open a pull request for this?
      options:
        - "Yes, if the shape is agreed"
        - "Maybe, with guidance"
        - "No, I am suggesting it"
    validations:
      required: true
