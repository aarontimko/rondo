name: Bug report
description: Something in rondo behaves wrongly.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Never report a security problem here. Use the **Security** tab and
        **Report a vulnerability**; a public issue is a disclosure.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The behaviour you saw, and the command that produced it.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered, from a fresh start, including the state of the Reaper project.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: >
        rondo has no version command, so give the commit:
        `git rev-parse --short HEAD`. Add your Reaper version as shown in
        REAPER > About REAPER.
      placeholder: "rondo abc1234, Reaper 7.79"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS and environment
      description: Your macOS version, your Python version, and the instruments involved.
      placeholder: "macOS 15.6 arm64, Python 3.12.4, Surge XT 1.3.4"
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Script output
      description: >
        The output of `python scripts/status.py --json`, and the failing
        command's own output, in code fences. Redact anything you do not want
        public: track names, project names and file paths are all in there.
      render: text
    validations:
      required: false
