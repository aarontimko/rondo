[project]
name = "rondo"
version = "0.1.0"
description = "A small toolkit that lets an LLM drive the Reaper DAW."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# No required dependencies on purpose: everything in scripts/ is stdlib, so
# `python scripts/status.py` works with no environment at all.
dependencies = []

[project.optional-dependencies]
# Only scripts/hum_to_grid.py needs these.
transcribe = ["librosa>=0.11", "soundfile"]

[tool.setuptools]
package-dir = { "" = "scripts" }

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["rondo*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E402", "E741"]  # E402: scripts bootstrap sys.path before importing rondo; E741: short math names in grid code

[tool.ruff.lint.per-file-ignores]
# The docstring header (summary/usage lines) is parsed by index.py; one line each.
"scripts/*.py" = ["E501"]
